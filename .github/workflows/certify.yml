name: certify

on:
  pull_request:

permissions:
  contents: read

jobs:
  certify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install
        run: npm ci

      - name: npx tsx tests
        run: npx --yes tsx --test src/lib/tests/*.test.ts examples/langgraph/graph.test.ts
        run: npx --yes tsx --test src/lib/tests

  sdk-rust:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: cargo test -p handoff-cert
        run: cargo test -p handoff-cert
        env:
          CI: "true"

