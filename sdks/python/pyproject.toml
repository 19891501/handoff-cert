[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "handoff-cert"
version = "0.1.0"
description = "HTTP client for POST /api/v1/certify — HANDOFF CERT (horizon 2030)."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "HANDOFF CERT" }]
# Stdlib only. Not published. "Private :: Do Not Upload" blocks accidental PyPI.
classifiers = [
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Development Status :: 3 - Alpha",
  "Private :: Do Not Upload",
]
dependencies = []

[project.urls]
Repository = "https://github.com/19891501/handoff-cert"

[tool.setuptools.packages.find]
where = ["src"]
